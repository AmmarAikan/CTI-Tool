services:
  redis:
    mem_limit: 512m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true
  db:
    mem_limit: 2g
    cpus: 1.50
    security_opt:
      - no-new-privileges:true
  misp-modules:
    mem_limit: 1536m
    cpus: 1.00
    security_opt:
      - no-new-privileges:true
  misp-core:
    mem_limit: 4g
    cpus: 2.50
    security_opt:
      - no-new-privileges:true
    ports: !override
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    networks:
      cti_backend_misp:
        aliases:
          - cti-misp
    healthcheck:
      test: ["CMD-SHELL", "curl -ks https://localhost/users/heartbeat >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 5m

networks:
  cti_backend_misp:
    external: true
    name: cti-backend-misp
