limit_req_zone $binary_remote_addr zone=cti_public_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cti_public_all:10m rate=20r/s;

server {
    listen 169.58.249.3:80;
    server_name 169.58.249.3;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cti-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 308 https://169.58.249.3$request_uri; }
}

server {
    listen 169.58.249.3:443 ssl;
    server_name 169.58.249.3;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/169.58.249.3/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/169.58.249.3/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_timeout 10m;

    client_max_body_size 10m;
    client_body_timeout 15s;
    limit_req_status 429;
    limit_req zone=cti_public_all burst=40 nodelay;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;

    # This is the only public hop. Overwrite all client-controlled proxy and
    # Tailscale identity headers before the loopback frontend receives them.
    proxy_set_header Host 169.58.249.3;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded "";
    proxy_set_header Tailscale-User-Login "";
    proxy_set_header Tailscale-User-Name "";
    proxy_set_header Tailscale-User-Profile-Pic "";
    proxy_set_header Tailscale-App-Capabilities "";
    proxy_set_header X-CTI-Client-Identity "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 7200s;

    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=cti_public_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:18080;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
    }
}
