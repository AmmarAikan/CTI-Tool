{
  "name": "${COMPOSE_PROJECT_NAME:-cti-ext-readiness}",
  "services": {
    "db": {
      "image": "postgres:16-alpine",
      "environment": {
        "POSTGRES_DB": "${POSTGRES_DB:?Copy .env.external-test.example to .env.external-test}",
        "POSTGRES_USER": "${POSTGRES_USER:?Copy .env.external-test.example to .env.external-test}",
        "POSTGRES_PASSWORD": "${POSTGRES_PASSWORD:?Copy .env.external-test.example to .env.external-test}"
      },
      "healthcheck": {
        "test": ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"],
        "interval": "5s",
        "timeout": "5s",
        "retries": 20
      },
      "networks": ["test_database"],
      "volumes": ["test_postgres:/var/lib/postgresql/data"],
      "security_opt": ["no-new-privileges:true"]
    },
    "external-sources": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.external"
      },
      "environment": {
        "EXTERNAL_API_TOKEN": "${EXTERNAL_API_TOKEN:?Copy .env.external-test.example to .env.external-test}",
        "EXTERNAL_API_ROLES": "operator",
        "EXTERNAL_API_DEV_WORKERS": "1",
        "EXTERNAL_API_DOCS_ENABLED": "false",
        "EXTERNAL_DARK_WEB_CONFIG_PATH": "/run/cti-test/dark-web/sources.json",
        "EXTERNAL_DARK_WEB_DISCOVERY_CONFIG_PATH": "/run/cti-test/dark-web/discovery-providers.json",
        "TOR_PROXY_HOST": "tor",
        "TOR_PROXY_PORT": "9050"
      },
      "networks": {
        "test_backend_external": {
          "aliases": ["cti-external-control"]
        },
        "test_external_egress": {}
      },
      "volumes": [
        "test_external_data:/app/data/external",
        "test_external_logs:/app/logs",
        "./config/sources.external-test.json:/app/config/sources.json:ro",
        "./config/dark_web_sources.external-test.json:/run/cti-test/dark-web/sources.json:ro",
        "${DARK_WEB_DISCOVERY_CONFIG_PATH:-./config/dark_web_discovery_providers.external-test.json}:/run/cti-test/dark-web/discovery-providers.json:ro"
      ],
      "depends_on": {"tor": {"condition": "service_healthy"}},
      "init": true,
      "read_only": true,
      "tmpfs": ["/tmp:size=128m,noexec,nosuid"],
      "security_opt": ["no-new-privileges:true"],
      "cap_drop": ["ALL"],
      "pids_limit": 256,
      "healthcheck": {
        "test": ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/external-sources/health', timeout=3).read()"],
        "interval": "10s",
        "timeout": "5s",
        "retries": 6,
        "start_period": "20s"
      }
    },
    "tor": {
      "image": "dperson/torproxy@sha256:d161ddddd47b4d2a91b8fe93d61e81b0760c0452ab6983a35ed37452e24004f6",
      "tmpfs": ["/tmp:size=32m,noexec,nosuid"],
      "security_opt": ["no-new-privileges:true"],
      "cap_drop": ["ALL"],
      "cap_add": ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"],
      "pids_limit": 128,
      "healthcheck": {
        "test": ["CMD-SHELL", "tor --version >/dev/null 2>&1 && (nc -z 127.0.0.1 9050 || timeout 2 bash -c '</dev/tcp/127.0.0.1/9050' >/dev/null 2>&1) || exit 1"],
        "interval": "15s", "timeout": "5s", "retries": 10, "start_period": "20s"
      },
      "networks": {"test_external_egress": {"aliases": ["tor"]}}
    },
    "backend": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile"
      },
      "environment": {
        "CTI_APP_ENV": "test",
        "POSTGRES_HOST": "db",
        "POSTGRES_PORT": "5432",
        "POSTGRES_DB": "${POSTGRES_DB:?Copy .env.external-test.example to .env.external-test}",
        "POSTGRES_USER": "${POSTGRES_USER:?Copy .env.external-test.example to .env.external-test}",
        "POSTGRES_PASSWORD": "${POSTGRES_PASSWORD:?Copy .env.external-test.example to .env.external-test}",
        "JWT_SECRET": "${JWT_SECRET:?Copy .env.external-test.example to .env.external-test}",
        "BOOTSTRAP_ADMIN_USERNAME": "${BOOTSTRAP_ADMIN_USERNAME:?Copy .env.external-test.example to .env.external-test}",
        "BOOTSTRAP_ADMIN_PASSWORD": "${BOOTSTRAP_ADMIN_PASSWORD:?Copy .env.external-test.example to .env.external-test}",
        "EXTERNAL_CONTROL_API_URL": "http://cti-external-control:8000/api/v1/external-sources",
        "EXTERNAL_CONTROL_API_TOKEN": "${EXTERNAL_API_TOKEN:?Copy .env.external-test.example to .env.external-test}",
        "EXTERNAL_CONTROL_VERIFY_TLS": "false",
        "EXTERNAL_CONTROL_ALLOW_HTTP": "true"
      },
      "depends_on": {
        "db": {"condition": "service_healthy"},
        "external-sources": {"condition": "service_healthy"}
      },
      "networks": {
        "test_database": {},
        "test_backend_external": {},
        "test_frontend_backend": {"aliases": ["backend"]}
      },
      "volumes": ["test_uploads:/app/data/uploads"],
      "init": true,
      "read_only": true,
      "tmpfs": ["/tmp:size=256m,noexec,nosuid"],
      "security_opt": ["no-new-privileges:true"],
      "cap_drop": ["ALL"],
      "pids_limit": 512,
      "healthcheck": {
        "test": ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"],
        "interval": "10s",
        "timeout": "5s",
        "retries": 6,
        "start_period": "30s"
      }
    },
    "frontend": {
      "build": {"context": "./frontend"},
      "image": "cti-ext-readiness-frontend:test",
      "depends_on": {"backend": {"condition": "service_healthy"}},
      "ports": ["127.0.0.1:19080:8080"],
      "networks": ["test_frontend_backend", "test_ingress"],
      "init": true,
      "read_only": true,
      "tmpfs": ["/tmp:size=16m,noexec,nosuid"],
      "security_opt": ["no-new-privileges:true"],
      "cap_drop": ["ALL"],
      "pids_limit": 128
    }
  },
  "networks": {
    "test_database": {"internal": true},
    "test_backend_external": {"internal": true},
    "test_frontend_backend": {"internal": true},
    "test_ingress": {},
    "test_external_egress": {}
  },
  "volumes": {
    "test_postgres": {},
    "test_uploads": {},
    "test_external_data": {},
    "test_external_logs": {}
  }
}
