services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - cti_postgres_data:/var/lib/postgresql/data
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CTI_APP_ENV: development
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      NVD_API_KEY: ${NVD_API_KEY:-}
      MISP_URL: ${MISP_URL:-}
      MISP_API_KEY: ${MISP_API_KEY:-}
      MISP_VERIFY_TLS: ${MISP_VERIFY_TLS:-true}
      EXTERNAL_FEED_URL: ${EXTERNAL_FEED_URL:-}
      EXTERNAL_FEED_TOKEN: ${EXTERNAL_FEED_TOKEN:-}
      EXTERNAL_FEED_HMAC_SECRET: ${EXTERNAL_FEED_HMAC_SECRET:-}
      EXTERNAL_FEED_VERIFY_TLS: ${EXTERNAL_FEED_VERIFY_TLS:-true}
      EXTERNAL_FEED_ALLOW_HTTP: ${EXTERNAL_FEED_ALLOW_HTTP:-false}
      EXTERNAL_FEED_REQUIRE_CONTRACT: ${EXTERNAL_FEED_REQUIRE_CONTRACT:-true}
      EXTERNAL_FEED_CONNECT_TIMEOUT_SECONDS: ${EXTERNAL_FEED_CONNECT_TIMEOUT_SECONDS:-5}
      EXTERNAL_FEED_READ_TIMEOUT_SECONDS: ${EXTERNAL_FEED_READ_TIMEOUT_SECONDS:-60}
      EXTERNAL_FEED_MAX_BYTES: ${EXTERNAL_FEED_MAX_BYTES:-104857600}
      EXTERNAL_FEED_MAX_PAGES: ${EXTERNAL_FEED_MAX_PAGES:-100}
      EXTERNAL_FEED_PAGE_SIZE: ${EXTERNAL_FEED_PAGE_SIZE:-250}
      EXTERNAL_CONTROL_API_URL: ${EXTERNAL_CONTROL_API_URL:-}
      EXTERNAL_CONTROL_API_TOKEN: ${EXTERNAL_CONTROL_API_TOKEN:-}
      EXTERNAL_CONTROL_VERIFY_TLS: ${EXTERNAL_CONTROL_VERIFY_TLS:-true}
      EXTERNAL_CONTROL_ALLOW_HTTP: ${EXTERNAL_CONTROL_ALLOW_HTTP:-false}
      EXTERNAL_CONTROL_TIMEOUT_SECONDS: ${EXTERNAL_CONTROL_TIMEOUT_SECONDS:-30}
      EXTERNAL_CONTROL_MAX_BYTES: ${EXTERNAL_CONTROL_MAX_BYTES:-2097152}
      WAZUH_INDEXER_URL: ${WAZUH_INDEXER_URL:-}
      WAZUH_INDEXER_USERNAME: ${WAZUH_INDEXER_USERNAME:-}
      WAZUH_INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-}
      WAZUH_INDEXER_TOKEN: ${WAZUH_INDEXER_TOKEN:-}
      WAZUH_INDEXER_VERIFY_TLS: ${WAZUH_INDEXER_VERIFY_TLS:-true}
      WAZUH_INDEXER_ALLOW_HTTP: ${WAZUH_INDEXER_ALLOW_HTTP:-false}
      WAZUH_INDEXER_TIMEOUT_SECONDS: ${WAZUH_INDEXER_TIMEOUT_SECONDS:-30}
      WAZUH_INDEXER_BATCH_SIZE: ${WAZUH_INDEXER_BATCH_SIZE:-500}
      WAZUH_INDEXER_NAME: ${WAZUH_INDEXER_NAME:-Wazuh VPS}
      WAZUH_INDEX_PATTERN: ${WAZUH_INDEX_PATTERN:-wazuh-alerts*}
      WAZUH_TIMESTAMP_FIELD: ${WAZUH_TIMESTAMP_FIELD:-timestamp}
      WAZUH_TIEBREAKER_FIELD: ${WAZUH_TIEBREAKER_FIELD:-id}
      WAZUH_INITIAL_SINCE: ${WAZUH_INITIAL_SINCE:-}
      DIONAEA_API_URL: ${DIONAEA_API_URL:-}
      DIONAEA_API_TOKEN: ${DIONAEA_API_TOKEN:-}
      DIONAEA_API_HMAC_SECRET: ${DIONAEA_API_HMAC_SECRET:-}
      DIONAEA_API_VERIFY_TLS: ${DIONAEA_API_VERIFY_TLS:-true}
      DIONAEA_API_ALLOW_HTTP: ${DIONAEA_API_ALLOW_HTTP:-false}
      DIONAEA_API_TIMEOUT_SECONDS: ${DIONAEA_API_TIMEOUT_SECONDS:-30}
      DIONAEA_API_MAX_BYTES: ${DIONAEA_API_MAX_BYTES:-20971520}
      DIONAEA_API_MAX_PAGES: ${DIONAEA_API_MAX_PAGES:-20}
      DIONAEA_API_PAGE_SIZE: ${DIONAEA_API_PAGE_SIZE:-500}
      DIONAEA_SENSOR_NAME: ${DIONAEA_SENSOR_NAME:-Dionaea VPS}
      INTERNAL_SENSOR_API_TOKEN: ${INTERNAL_SENSOR_API_TOKEN:-}
      INTERNAL_SENSOR_API_HMAC_SECRET: ${INTERNAL_SENSOR_API_HMAC_SECRET:-}
      INTERNAL_SENSOR_VERIFY_TLS: ${INTERNAL_SENSOR_VERIFY_TLS:-true}
      INTERNAL_SENSOR_ALLOW_HTTP: ${INTERNAL_SENSOR_ALLOW_HTTP:-false}
      INTERNAL_SENSOR_TIMEOUT_SECONDS: ${INTERNAL_SENSOR_TIMEOUT_SECONDS:-30}
      INTERNAL_SENSOR_MAX_BYTES: ${INTERNAL_SENSOR_MAX_BYTES:-20971520}
      INTERNAL_SENSOR_MAX_PAGES: ${INTERNAL_SENSOR_MAX_PAGES:-20}
      INTERNAL_SENSOR_PAGE_SIZE: ${INTERNAL_SENSOR_PAGE_SIZE:-500}
      HOST_AUTH_API_URL: ${HOST_AUTH_API_URL:-}
      HOST_AUTH_SENSOR_NAME: ${HOST_AUTH_SENSOR_NAME:-VPS SSH Authentication}
      WEB_ACCESS_API_URL: ${WEB_ACCESS_API_URL:-}
      WEB_ACCESS_SENSOR_NAME: ${WEB_ACCESS_SENSOR_NAME:-VPS Gateway Access}
      NER_MIN_CONFIDENCE: ${NER_MIN_CONFIDENCE:-0.50}
      NER_CHUNK_CHARS: ${NER_CHUNK_CHARS:-600}
      NER_CHUNK_OVERLAP_CHARS: ${NER_CHUNK_OVERLAP_CHARS:-100}
      NER_INFERENCE_BATCH_SIZE: ${NER_INFERENCE_BATCH_SIZE:-8}
      NER_CACHE_SIZE: ${NER_CACHE_SIZE:-4096}
      DIONAEA_JSON_LOG_PATH: /data/dionaea/dionaea.json
      DIONAEA_MAX_LOG_BYTES: ${DIONAEA_MAX_LOG_BYTES:-52428800}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - honeypot_lab
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - cti_uploads:/app/data/uploads
      - ./ml/models/dnrti_bert_ner:/app/ml/models/dnrti_bert_ner:ro
      - ./ml/reports:/app/ml/reports:ro
      - dionaea_data:/data/dionaea:ro

  adminer:
    profiles: ["database-ui"]
    image: adminer:5.4.1-standalone@sha256:dc99eedc418df241629e5ec80e3289553605788e6aca04f5f4b039f61d2dac91
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true

  dionaea:
    profiles: ["honeypot"]
    build:
      context: ./infra/dionaea
    image: cti-dionaea:0.11.0
    restart: unless-stopped
    init: true
    environment:
      DIONAEA_FORCE_INIT_DATA: "1"
    networks:
      - honeypot_lab
    volumes:
      - dionaea_data:/opt/dionaea/var/lib/dionaea
      - dionaea_logs:/opt/dionaea/var/log/dionaea

networks:
  default:
  honeypot_lab:
    internal: true

volumes:
  cti_postgres_data:
  cti_uploads:
  dionaea_data:
  dionaea_logs:
