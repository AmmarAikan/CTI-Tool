name: actit-defense-demo

x-backend-environment: &backend-environment
  CTI_APP_ENV: demo
  POSTGRES_HOST: demo-db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: actit_demo
  POSTGRES_USER: actit_demo
  POSTGRES_PASSWORD: actit-demo-database-password
  JWT_SECRET: actit-defense-demo-jwt-secret-not-production

services:
  demo-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: actit_demo
      POSTGRES_USER: actit_demo
      POSTGRES_PASSWORD: actit-demo-database-password
    tmpfs:
      - /var/lib/postgresql/data:size=512m
    networks:
      - demo-core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actit_demo -d actit_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true

  demo-seed:
    image: actit-defense-backend:head
    pull_policy: never
    environment:
      <<: *backend-environment
      ACTIT_DEMO_SEED: confirmed
    command: ["python", "-m", "scripts.create_demo_dataset", "--configured-defense-demo"]
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      demo-db:
        condition: service_healthy
    networks:
      - demo-core
    restart: "no"
    security_opt:
      - no-new-privileges:true

  demo-provider:
    image: actit-defense-backend:head
    pull_policy: never
    environment:
      EXTERNAL_API_TOKEN: demo-external-control-token-2026
    command: ["python", "-m", "uvicorn", "scripts.defense_demo_provider:app", "--host", "0.0.0.0", "--port", "8081"]
    volumes:
      - ./scripts:/app/scripts:ro
    networks:
      demo-core:
        aliases:
          - cti-misp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3).read()"]
      interval: 2s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  gateway-init:
    image: actit-defense-gateway:head
    pull_policy: never
    user: "0:0"
    command:
      - python
      - -c
      - |
        from pathlib import Path
        import os
        target = Path('/data/web_access.jsonl')
        target.write_bytes(Path('/fixtures/web_access.jsonl').read_bytes())
        os.chown(target, 10001, 10001)
        os.chown('/data', 10001, 10001)
    volumes:
      - demo_gateway_data:/data
      - ./tests/fixtures/defense_demo:/fixtures:ro
    networks:
      - demo-core
    restart: "no"

  demo-gateway:
    image: actit-defense-gateway:head
    build:
      context: ./infra/vps/gateway
    environment:
      FEED_PUBLISH_TOKEN: demo-feed-publish-token-2026
      FEED_READ_TOKEN: demo-feed-read-token-2026-only
      FEED_RESPONSE_HMAC_SECRET: demo-feed-response-hmac-secret-2026
      SENSOR_READ_TOKEN: demo-sensor-read-token-2026
      SENSOR_RESPONSE_HMAC_SECRET: demo-sensor-response-hmac-secret-2026
      CURSOR_HMAC_SECRET: demo-cursor-hmac-secret-2026
      GATEWAY_DATA_DIR: /data
      DIONAEA_LOG_PATH: /sensors/dionaea/dionaea.json
      HOST_AUTH_LOG_PATH: /sensors/host/host_auth.jsonl
    volumes:
      - demo_gateway_data:/data
      - ./tests/fixtures/defense_demo/dionaea.jsonl:/sensors/dionaea/dionaea.json:ro
      - ./tests/fixtures/defense_demo/host_auth.jsonl:/sensors/host/host_auth.jsonl:ro
    depends_on:
      gateway-init:
        condition: service_completed_successfully
    networks:
      - demo-core
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 2s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    image: actit-defense-backend:head
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *backend-environment
      UPLOAD_DIR: /tmp/uploads
      EXTERNAL_CONTROL_API_URL: http://demo-provider:8081
      EXTERNAL_CONTROL_API_TOKEN: demo-external-control-token-2026
      EXTERNAL_CONTROL_VERIFY_TLS: "false"
      EXTERNAL_CONTROL_ALLOW_HTTP: "true"
      DIONAEA_API_URL: http://demo-gateway:8080/api/v1/sensors/dionaea
      DIONAEA_API_TOKEN: demo-sensor-read-token-2026
      DIONAEA_API_HMAC_SECRET: demo-sensor-response-hmac-secret-2026
      DIONAEA_API_VERIFY_TLS: "false"
      DIONAEA_API_ALLOW_HTTP: "true"
      HOST_AUTH_API_URL: http://demo-gateway:8080/api/v1/sensors/host-auth
      HOST_AUTH_SENSOR_NAME: Demo Host Authentication
      WEB_ACCESS_API_URL: http://demo-gateway:8080/api/v1/sensors/web-access
      WEB_ACCESS_SENSOR_NAME: Demo Web Access
      INTERNAL_SENSOR_API_TOKEN: demo-sensor-read-token-2026
      INTERNAL_SENSOR_API_HMAC_SECRET: demo-sensor-response-hmac-secret-2026
      INTERNAL_SENSOR_VERIFY_TLS: "false"
      INTERNAL_SENSOR_ALLOW_HTTP: "true"
      MISP_URL: http://cti-misp:8081
      MISP_API_KEY: demo-misp-preview-key-no-live-delivery
      MISP_VERIFY_TLS: "false"
      MISP_ALLOW_HTTP: "true"
    volumes:
      - ./ml/reports:/app/ml/reports:ro
    depends_on:
      demo-seed:
        condition: service_completed_successfully
      demo-provider:
        condition: service_healthy
      demo-gateway:
        condition: service_healthy
    networks:
      - demo-core
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    image: actit-defense-frontend:head
    build:
      context: ./frontend
      args:
        VITE_MISP_DELIVERY_DISABLED: "true"
        VITE_ACTIT_DEMO_MODE: "true"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - demo-core
      - demo-ingress
    ports:
      - "127.0.0.1:${ACTIT_DEMO_PORT:-19090}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  demo-smoke:
    image: actit-defense-smoke:head
    build:
      context: .
      dockerfile: scripts/defense_demo_smoke.Dockerfile
    profiles:
      - validation
    working_dir: /workspace
    volumes:
      - ./scripts/defense_demo_smoke.py:/workspace/scripts/defense_demo_smoke.py:ro
    networks:
      - demo-core
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  demo-core:
    internal: true
  demo-ingress:
    internal: false

volumes:
  demo_gateway_data:
